spring.application.name=openugc

# Database Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Port (Render will ignore this and use 10000)
server.port=${PORT:8080}

# Client IP behind a reverse proxy.
# Tomcat reads X-Forwarded-For  when the request comes from a
# trusted proxy, and then request.getRemoteAddr() returns the real client IP.
# Change them with SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES if your proxy uses a public IP,
# or set it to an empty value to trust no proxy at all.
server.forward-headers-strategy=native

# Flyway Migration Configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Authentication key
jwt.secret=${JWT_SECRET}

# Define Profile for DB
spring.profiles.active=${DATABASE_PROFILE}

# Storage type: 'local' or 'cloud'
file.storage.type=${STORAGE_TYPE}

# Local storage settings
file.storage.location=${STORAGE_LOCATION}
# Optional. Only needed to read files uploaded before storage keys existed (rows that saved
# the full URL). API responses link to /api/content/download/{id} and /api/content/thumbnail/{id}.
file.storage.baseUrl=${STORAGE_BASEURL:}

# Cloud storage settings (for example, Google Cloud Storage)
file.cloud.bucket=${CLOUD_BUCKET}
# Optional, same as file.storage.baseUrl.
file.cloud.baseUrl=${CLOUD_BASEURL:}

# Upload files size config
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# Debug logging is off by default.
logging.level.org.springframework.security=INFO
spring.jpa.show-sql=false

# Guest user Config
# Currently if guest.enable is set to false, all tokens generated from the auth/guest will remain valid until they naturally expire
guest.enabled=true
guest.can-post=false

# Use RFC 9457 ProblemDetail as the body for Spring's own errors too,
# so every error response (ours and the framework's) has the same shape.
spring.mvc.problemdetails.enabled=true
