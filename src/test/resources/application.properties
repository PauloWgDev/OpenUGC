# ---- Test configuration ----
# This file fully shadows src/main/resources/application.properties during tests,
# so every property the app needs is provided here with test-safe values.
# The datasource is injected at runtime by AbstractIntegrationTest (Testcontainers),
# and the "postgres" profile is activated via @ActiveProfiles.

# Schema is created by Hibernate from the entities.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# No Flyway migrations exist yet; let Hibernate own the schema in tests.
# Flip this on once V__ migrations are added (release item #14).
spring.flyway.enabled=false

# Auth
jwt.secret=test-only-secret-key-at-least-32-bytes-long!!

# Storage (local; no cloud/Google credentials needed)
file.storage.type=local
file.storage.location=${java.io.tmpdir}/openugc-test-storage
file.storage.baseUrl=http://localhost/test-storage/
file.cloud.bucket=test-bucket
file.cloud.baseUrl=http://localhost/test-cloud/

# Guest config
guest.enabled=true
guest.can-post=false

# Keep test output readable
logging.level.org.springframework.security=INFO
spring.jpa.show-sql=false
