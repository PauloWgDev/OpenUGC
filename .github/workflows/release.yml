name: Release

# Runs when a version tag is pushed, e.g.  git tag -a v0.0.1 -m "OpenUGC 0.0.1" && git push origin v0.0.1
on:
  push:
    tags: [ 'v*' ]

# One release at a time; never cancel one halfway through
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create the GitHub release and upload the jar
  packages: write   # push the image to ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/openugc

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: needed for the master check and the generated notes

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check tag matches pom version and is on master
        id: version
        run: |
          chmod +x ./mvnw
          TAG="${GITHUB_REF_NAME}"
          POM_VERSION=$(./mvnw -q -B help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "${TAG}" != "v${POM_VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match pom version ${POM_VERSION} (expected v${POM_VERSION})"
            exit 1
          fi
          case "${POM_VERSION}" in
            *-SNAPSHOT) echo "::error::Refusing to release a SNAPSHOT version"; exit 1 ;;
          esac
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "::error::Tag ${TAG} points to a commit that is not on master"
            exit 1
          fi
          # A version with a suffix (0.1.0-rc.1) is a prerelease; plain versions are normal releases
          if [[ "${POM_VERSION}" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          echo "version=${POM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./mvnw -B verify

      - name: Prepare release assets
        run: |
          mkdir dist
          cp target/openugc-${{ steps.version.outputs.version }}.jar dist/
          cd dist && sha256sum *.jar > SHA256SUMS

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.prerelease == 'false' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then FLAGS="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "OpenUGC ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --verify-tag \
            ${FLAGS}
