services:
  open-ugc:
    build: .
    container_name: open-ugc

    ports:
      - "8080:8080"

    environment:
      DATABASE_PROFILE: postgres

      DATABASE_URL: jdbc:postgresql://postgres:5432/openapitest
      DATABASE_USERNAME: username     # change this
      DATABASE_PASSWORD: password     # change this

      JWT_SECRET: aSecureRandomGeneratedKeyThatIsAtLeast32BytesLong! # change this

      STORAGE_TYPE: local

      STORAGE_LOCATION: /storage

      CLOUD_BUCKET: your-bucket

      GOOGLE_APPLICATION_CREDENTIALS: /credentials/google.json

    volumes:
      - ./storage:/storage
      - ./credentials/google.json:/credentials/google.json:ro

    depends_on:
      - postgres

  postgres:
    image: postgres:17

    container_name: postgres

    environment:
      POSTGRES_DB: openapitest
      POSTGRES_USER: username     # change this
      POSTGRES_PASSWORD: password # change this

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: