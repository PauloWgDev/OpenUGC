services:
  open-ugc:
    build: .
    container_name: open-ugc

    ports:
      - "8080:8080"

    environment:
      DATABASE_PROFILE: postgres

      DATABASE_URL: jdbc:postgresql://postgres:5432/openapitest
      DATABASE_USERNAME: username     # change this
      DATABASE_PASSWORD: password     # change this

      # Required. The app won't start until you replace this with your own secret
      JWT_SECRET: CHANGE_ME

      STORAGE_TYPE: local

      STORAGE_LOCATION: /storage

      CLOUD_BUCKET: your-bucket

      GOOGLE_APPLICATION_CREDENTIALS: /credentials/google.json

    volumes:
      - ./storage:/storage
      - ./credentials/google.json:/credentials/google.json:ro

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17

    container_name: postgres

    environment:
      POSTGRES_DB: openapitest
      POSTGRES_USER: username     # change this
      POSTGRES_PASSWORD: password # change this

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: