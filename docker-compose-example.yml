services:
  open-ugc:
    build: .
    container_name: open-ugc

    ports:
      - "8080:8080"

    environment:
      DATABASE_PROFILE: postgres

      DATABASE_URL: jdbc:postgresql://postgres:5432/openapitest
      DATABASE_USERNAME: username
      DATABASE_PASSWORD: password

      JWT_SECRET: aSecureRandomGeneratedKeyThatIsAtLeast32BytesLong!

      STORAGE_TYPE: local

      STORAGE_LOCATION: /storage
      STORAGE_BASEURL: http://localhost:8080/storage/

      CLOUD_BUCKET: u3gc-uploads
      CLOUD_BASEURL: https://storage.googleapis.com/open-uploads/

      GOOGLE_APPLICATION_CREDENTIALS: /credentials/google.json

    volumes:
      - ./storage:/storage
      - ./credentials/google.json:/credentials/google.json:ro

    depends_on:
      - postgres

  postgres:
    image: postgres:17

    container_name: postgres

    environment:
      POSTGRES_DB: openapitest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: